name: Blender sculpted dice assets (experimental)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"
permissions:
  contents: write
jobs:
  sculpt:
    name: Offline GLB sculpt and actual render evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin exact PR source SHA. fetch-depth=1 hides HEAD^ from git diff-tree,
          # allowing empty "changed" output and a false GREEN sculpt build.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Decide whether actual Blender sources changed
        id: art_source
        shell: bash
        run: |
          if ! git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
            echo "FAIL: parent commit unavailable, cannot establish model source diff"
            exit 9
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\\n' "$changed"
          if printf '%s\\n' "$changed" | grep -Eq '^(tools/blender/|\\.github/workflows/blender-assets\\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Pinned GLB files already exist. Skip costly Blender/MeshLab recreation."
          fi
      - name: Install reproducible offline modeling dependencies
        if: steps.art_source.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy fonts-dejavu-core meshlab xvfb imagemagick
      - name: Verify Blender glTF Python dependencies
        if: steps.art_source.outputs.run == 'true'
        run: blender --background -noaudio --python-exit-code 2 --python-expr "import numpy; print('NumPy import OK:', numpy.__version__)"
      - name: Generate truly cut numeral meshes and glTF exports
        if: steps.art_source.outputs.run == 'true'
        run: |
          mkdir -p build/premium-glb
          blender --background -noaudio --python-exit-code 2 --python tools/blender/generate_die_assets.py -- --output build/premium-glb > build/premium-glb/generator.log 2>&1 || { tail -160 build/premium-glb/generator.log; exit 1; }
          tail -35 build/premium-glb/generator.log
          grep -F "PASS Blender true digit Boolean engraving + GLB export, D20 D6 D8 D12 D4" build/premium-glb/generator.log
          for tex in obsidian_albedo obsidian_roughness obsidian_normal; do
            test -s "build/premium-glb/${tex}.png"
          done
          for die in d20 d6 d8 d12 d4; do
            test -s "build/premium-glb/${die}_boolean_engraved.glb"
            test -s "build/premium-glb/${die}_boolean_preview.png"
            test -s "build/premium-glb/${die}_stone_qa.ply"
          done
      - name: Verify asset manifest with no gameplay injection
        if: steps.art_source.outputs.run == 'true'
        run: |
          python3 tools/blender/validate_glb.py build/premium-glb
      - name: Inspect authored Boolean stone with Meshlab CLI and ImageMagick
        if: steps.art_source.outputs.run == 'true'
        run: |
          set -euo pipefail
          for die in d20 d6 d8 d12 d4; do
            xvfb-run -a meshlabserver -i "build/premium-glb/${die}_stone_qa.ply" -o "build/premium-glb/${die}_checked.obj" > "build/premium-glb/${die}_meshlab.log" 2>&1 || { tail -50 "build/premium-glb/${die}_meshlab.log"; exit 1; }
            test -s "build/premium-glb/${die}_checked.obj"
          done
          for tex in obsidian_albedo obsidian_roughness obsidian_normal; do
            identify -format "%f %wx%h %[colorspace]\\n" "build/premium-glb/${tex}.png"
            test "$(identify -format '%wx%h' "build/premium-glb/${tex}.png")" = "256x256"
          done
      - name: Preserve real Blender GLB and preview evidence
        if: ${{ always() && steps.art_source.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-blender-boolean-sculpted-assets
          path: build/premium-glb/
          retention-days: 14
          if-no-files-found: warn

      - name: Refresh validated GLBs when source art actually changed on the draft branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m5-approved-minimal-premium-visual-pass-1' && github.event.pull_request.draft && steps.art_source.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p src/assets/generated
          # Only generator changes may refresh nondeterministic Blender GLBs.
          # Documentation, QA and workflow updates must not produce bot churn.
          if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -qx 'tools/blender/generate_die_assets.py'; then
            echo "Blender model source unchanged in head commit: do not rewrite GLB binaries."
            exit 0
          fi
          # Release pipeline is branch-guarded above. Compare regenerated bytes:
          # avoid downstream CI recursion; a model change is a separate commit.
          for die in d20 d6 d8 d12 d4; do
            cp "build/premium-glb/${die}_boolean_engraved.glb" "src/assets/generated/${die}_boolean_engraved.glb"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/generated/d20_boolean_engraved.glb src/assets/generated/d6_boolean_engraved.glb src/assets/generated/d8_boolean_engraved.glb src/assets/generated/d12_boolean_engraved.glb src/assets/generated/d4_boolean_engraved.glb
          if git diff --cached --quiet; then
            echo "Existing GLBs match regenerated proof; no writes."
            exit 0
          fi
          git commit -m "assets(m5): refresh validated offline Blender PBR GLBs"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
