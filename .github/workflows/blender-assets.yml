name: Blender sculpted dice assets (experimental)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"
permissions:
  contents: write
jobs:
  sculpt:
    name: Offline GLB sculpt and actual render evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout actual draft head, not the synthetic PR merge commit.
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install reproducible offline modeling dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy fonts-dejavu-core
      - name: Verify Blender glTF Python dependencies
        run: blender --background -noaudio --python-exit-code 2 --python-expr "import numpy; print('NumPy import OK:', numpy.__version__)"
      - name: Generate truly cut numeral meshes and glTF exports
        run: |
          mkdir -p build/premium-glb
          blender --background -noaudio --python-exit-code 2 --python tools/blender/generate_die_assets.py -- --output build/premium-glb > build/premium-glb/generator.log 2>&1 || { tail -160 build/premium-glb/generator.log; exit 1; }
          tail -35 build/premium-glb/generator.log
          grep -F "PASS Blender true digit Boolean engraving" build/premium-glb/generator.log
          for tex in obsidian_albedo obsidian_roughness obsidian_normal; do
            test -s "build/premium-glb/${tex}.png"
          done
          for die in d20 d6; do
            test -s "build/premium-glb/${die}_boolean_engraved.glb"
            test -s "build/premium-glb/${die}_boolean_preview.png"
          done
      - name: Verify asset manifest with no gameplay injection
        run: |
          python3 tools/blender/validate_glb.py build/premium-glb
      - name: Preserve real Blender GLB and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-blender-boolean-sculpted-assets
          path: build/premium-glb/
          retention-days: 14
          if-no-files-found: warn

      - name: Refresh validated GLBs when source art actually changed on the draft branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m5-approved-minimal-premium-visual-pass-1' && github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          mkdir -p src/assets/generated
          # Release pipeline is branch-guarded above. Compare regenerated bytes:
          # avoid downstream CI recursion; a model change is a separate commit.
          cp build/premium-glb/d20_boolean_engraved.glb src/assets/generated/d20_boolean_engraved.glb
          cp build/premium-glb/d6_boolean_engraved.glb src/assets/generated/d6_boolean_engraved.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/generated/d20_boolean_engraved.glb src/assets/generated/d6_boolean_engraved.glb
          if git diff --cached --quiet; then
            echo "Existing GLBs match regenerated proof; no writes."
            exit 0
          fi
          git commit -m "assets(m5): refresh validated offline Blender PBR GLBs"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
