name: M4 Real Multi-die Jolt QA
on:
  push:
    branches: [qa/m4-physical-pool]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-mixed-pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Import approved physical Godot/Jolt scene
        run: godot --headless --path . --editor --quit
      - name: Check all multi-body Jolt scripts parse
        run: |
          godot --headless --path . --check-only --script res://src/core/physical_roll_pool.gd
          godot --headless --path . --check-only --script res://tests/m4_physical_pool.gd
      - name: Exercise genuine mixed physical bodies, percentile and D20 advantage
        run: godot --headless --path . --script res://tests/m4_physical_pool.gd
      - name: Check new M4 real gameplay HUD and drawer scripts parse
        run: |
          godot --headless --path . --check-only --script res://src/main.gd
          godot --headless --path . --check-only --script res://src/ui/m4_advanced_roll_drawer.gd
          godot --headless --path . --check-only --script res://tests/m4_advanced_ui_integration.gd
      - name: Test real UI clicks and physical Jolt mixed results persisted offline
        run: godot --headless --path . --script res://tests/m4_advanced_ui_integration.gd
      - name: Install authentic video capture, Xvfb and Pillow
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 libfontconfig1 libxcursor1 \
            libxrandr2 libxi6 libxinerama1 libxrender1 libxext6 libxfixes3 \
            libxkbcommon0 libwayland-cursor0 python3-pil
      - name: Record user-visible M4 drawer, live Jolt mixed dice, and settled total
        run: bash tools/visual/run_m4_ui_capture.sh
      - name: Inspect each real video screenshot and publish 24-frame sheets
        run: python3 tools/visual/audit_m4_ui_frames.py qa-evidence/m4-ui-24fps
      - name: Preserve M4 visual evidence even on failed video/frame QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-ui-real-jolt-24fps-every-frame
          path: qa-evidence/m4-ui-24fps/
          if-no-files-found: warn
          retention-days: 14
      - name: Formula parser regression
        run: godot --headless --path . --script res://tests/m4_roll_formula.gd
      - name: Percentile input authenticity regression
        run: godot --headless --path . --script res://tests/percentile_pair_mapping.gd
