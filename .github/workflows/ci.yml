name: Godot M3 validation and Android debug
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      fresh_assets:
        type: boolean
        required: false
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Import and unit tests
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Consume same-run fresh GLBs (not stale repository binaries)
        if: inputs.fresh_assets
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-fresh-glbs
          path: build/gauntlet-glb
      - name: Check GLB SHA256 and install before Godot import
        if: inputs.fresh_assets
        run: |
          set -eu
          (cd build/gauntlet-glb && sha256sum -c glb-sha256.txt)
          mkdir -p src/assets/generated
          for die in d4 d6 d8 d12 d20; do
            test -s "build/gauntlet-glb/${die}_boolean_engraved.glb"
            cp "build/gauntlet-glb/${die}_boolean_engraved.glb" "src/assets/generated/${die}_boolean_engraved.glb"
          done
      - name: Initialize Godot import
        run: godot --headless --path . --editor --quit
      - name: Preflight compile every GDScript test before Jolt simulation
        run: |
          set -eu
          for gdscript in tests/*.gd; do
            godot --headless --path . --check-only --script "res://$gdscript"
          done
      - name: Deterministic mechanics tests
        run: godot --headless --path . --script res://tests/smoke.gd
      - name: M4 actual-face mixed formula, modifiers, selected D20 and D100 trace tests
        run: godot --headless --path . --script res://tests/m4_roll_formula.gd
      - name: M4 offline versioned results/presets with integrity and corruption QA
        run: godot --headless --path . --script res://tests/m4_roll_persistence.gd
      - name: M4 genuine Jolt mixed physical dice and paired percentile
        run: godot --headless --path . --script res://tests/m4_physical_pool.gd
      - name: M4 actual drawer click plus genuine mixed Jolt and offline history
        run: godot --headless --path . --script res://tests/m4_advanced_ui_integration.gd
      - name: M4 selectively reroll actual Jolt body and retain all untouched real faces
        run: godot --headless --path . --script res://tests/m4_physical_reroll.gd
      - name: M4 click physical source picker, reroll and audit local history
        run: godot --headless --path . --script res://tests/m4_reroll_ui_integration.gd
      - name: M4 browse/search ALL preserved physical history and inspect every source face
        run: godot --headless --path . --script res://tests/m4_full_history_browser.gd
      - name: Physical scene integration smoke
        run: godot --headless --path . --script res://tests/physics_smoke.gd
      - name: Natural D20-only non-colliding spatial critical aura
        run: godot --headless --path . --script res://tests/critical_aura.gd
      # Exercise new D10/D100 before stochastic legacy regressions, so a
      # rare unrelated D6 edge-rest does not hide new-shape diagnostics.
      - name: M3 D10/D100 true kite-face convex geometry and result normals
        run: godot --headless --path . --script res://tests/trapezohedron_geometry.gd
      - name: M3 exhaustive 100 outcome two-D10 mapping
        run: godot --headless --path . --script res://tests/percentile_pair_mapping.gd
      - name: M3 D10, single D100, dual-D10 percentile real Jolt integration
        run: godot --headless --path . --script res://tests/trapezohedron_physics.gd
      - name: M3 rapid repeated percentile pair Jolt lifecycle regression
        run: godot --headless --path . --script res://tests/m3_pair_lifecycle.gd
      - name: M3 secure source RNG frequency sanity (not physical fairness proof)
        run: godot --headless --path . --script res://tests/m3_secure_rng_sanity.gd
      - name: M3 extended Jolt endurance with real D10, D100 and percentile pair
        run: godot --headless --path . --script res://tests/m3_trapezohedron_endurance.gd
      - name: M3 D6 mathematical symmetry proof
        run: godot --headless --path . --script res://tests/cube_symmetry.gd
      - name: M3 real numbered D6 physics and result agreement
        run: godot --headless --path . --script res://tests/numbered_d6_physics.gd
      - name: M3 D20 geometry and 60 rotations
        run: godot --headless --path . --script res://tests/d20_geometry.gd
      - name: M3 numbered physical D20 and face outcome
        run: godot --headless --path . --script res://tests/numbered_d20_physics.gd
      - name: M3 D8 octahedron geometry and fairness proof
        run: godot --headless --path . --script res://tests/d8_geometry.gd
      - name: M3 physical numbered D8 integration
        run: godot --headless --path . --script res://tests/numbered_d8_physics.gd
      - name: M3 D12 mathematically correct dodecahedron
        run: godot --headless --path . --script res://tests/d12_geometry.gd
      - name: M3 D12 real numbered Jolt physics
        run: godot --headless --path . --script res://tests/numbered_d12_physics.gd
      - name: M3 D4 exact tetrahedral apex-number symmetries
        run: godot --headless --path . --script res://tests/d4_geometry.gd
      - name: M3 numbered tetrahedral D4 Jolt physics
        run: godot --headless --path . --script res://tests/numbered_d4_physics.gd
      - name: Upload physical endurance evidence even if trials fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-physical-jolt-endurance
          path: qa-evidence/m3-stress/endurance.json
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Android ARM64 debug export
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Consume same-run fresh GLBs (not stale repository binaries)
        if: inputs.fresh_assets
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-fresh-glbs
          path: build/gauntlet-glb
      - name: Check GLB SHA256 and install before Godot import
        if: inputs.fresh_assets
        run: |
          set -eu
          (cd build/gauntlet-glb && sha256sum -c glb-sha256.txt)
          mkdir -p src/assets/generated
          for die in d4 d6 d8 d12 d20; do
            test -s "build/gauntlet-glb/${die}_boolean_engraved.glb"
            cp "build/gauntlet-glb/${die}_boolean_engraved.glb" "src/assets/generated/${die}_boolean_engraved.glb"
          done
      - name: Prepare export templates and debug credentials
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.6.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -p ~/.config/godot
          [ ! -d /root/.config/godot ] || cp -rn /root/.config/godot/. ~/.config/godot/ || true
          test -f /root/debug.keystore
          mkdir -p build/android
      - name: Import resources
        run: godot --headless --path . --editor --quit
      - name: Export debug APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path . --export-debug "Android Debug" build/android/dice-3d-m3-d4-debug.apk
          test -s build/android/dice-3d-m3-d4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: m3-d4-android-debug
          path: build/android/dice-3d-m3-d4-debug.apk
          if-no-files-found: error
          retention-days: 14

