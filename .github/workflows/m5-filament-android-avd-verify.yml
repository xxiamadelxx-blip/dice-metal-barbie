name: M5 native Filament Android real emulator startup
on:
  push:
    branches: [experiment/m5-android-renderer-alternatives]
    paths:
      - ".github/workflows/m5-filament-android-avd-verify.yml"
      - "experiments/android-renderers/filament-android/tests/avd_smoke.sh"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install-native-filament-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Allow KVM Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "KVM unavailable"; fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38659583586
          name: M5-Filament-native-Android-PBR-debug-APK
          path: build/filament-avd-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 720
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash experiments/android-renderers/filament-android/tests/avd_smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M5-Filament-native-Android-real-AVD-startup-and-PNG
          path: build/filament-avd-proof/
          retention-days: 21
          if-no-files-found: warn
