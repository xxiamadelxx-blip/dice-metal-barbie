name: Fendi figure | local TripoSR CPU in Blender cloud
on:
  push:
    branches:
      - experiment/fendi-ss23-figure-qa
    paths:
      - experiments/fendi-ss23/generate_cpu.py
      - experiments/fendi-ss23/render.py
      - .github/workflows/fendi-figure-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fendi-triposr-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-real-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender, image tools, and source TripoSR CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libgl1 libglib2.0-0
          git clone --depth=1 https://huggingface.co/spaces/emerro/image3d-triposr /tmp/fendi-triposr
          echo TRIPOSR_REPOSITORY_REQUIREMENTS
          cat /tmp/fendi-triposr/requirements.txt
          blender -b --version | head -4
      - name: Prepare direct CPU model environment
        run: |
          python3 -m venv /tmp/fendi-cpu
          /tmp/fendi-cpu/bin/pip install -q --upgrade pip
          /tmp/fendi-cpu/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/fendi-cpu/bin/pip install -q 'rembg[cpu]' onnxruntime Pillow numpy scipy einops 'omegaconf' trimesh scikit-image huggingface_hub 'transformers==4.36.2' safetensors imageio 'jaxtyping' 'kiui'
          /tmp/fendi-cpu/bin/python -c "import torch; print('torch',torch.__version__,'CPU')"
      - name: Obtain exact 1600x2400 reference
        run: |
          mkdir -p build/fendi-ss23
          curl -fLSs --retry 3 -o build/fendi-ss23/reference.jpg https://fashionsnap-assets.com/article/images/2022/09/fendi_w23ss_look_053.jpeg
      - name: Execute CPU neural reconstruction with honest status
        run: |
          /tmp/fendi-cpu/bin/python experiments/fendi-ss23/generate_cpu.py
          cat build/fendi-ss23/cpu_generation.json
      - name: Import GLB and render actual Blender mesh
        run: |
          if [ -s build/fendi-ss23/candidate.glb ]; then
            blender -b -t 4 --python experiments/fendi-ss23/render.py
          else
            echo "NOT VERIFIED: TripoSR produced no GLB; inspect diagnostic record"
          fi
      - name: Retain source and real QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fendi-triposr-cpu-qa
          path: build/fendi-ss23/
          retention-days: 14
          if-no-files-found: warn
