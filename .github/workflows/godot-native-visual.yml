name: Godot cloud scene visual QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/visual_capture.gd"
      - "tests/engraved_assets.gd"
      - ".github/workflows/godot-native-visual.yml"
      - "project.godot"
permissions:
  contents: read

jobs:
  native-scene:
    name: Render actual Godot scene and capture frames (Linux Mesa)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa/X11 runtime libraries for Godot
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libfontconfig1 libxcursor1 libxrandr2 libxi6 libxinerama1 libxrender1 libxext6 libxfixes3 libxkbcommon0 libwayland-cursor0 python3-pil
          mkdir -p qa-evidence
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Verify production mesh geometry and 3D engraved numerals
        run: |
          godot --headless --path . --script res://tests/engraved_assets.gd > qa-evidence/engraved-assets.log 2>&1 || { tail -120 qa-evidence/engraved-assets.log; exit 1; }
          cat qa-evidence/engraved-assets.log
          godot --headless --path . --script res://tests/critical_aura.gd > qa-evidence/critical-aura.log 2>&1 || { tail -120 qa-evidence/critical-aura.log; exit 1; }
          cat qa-evidence/critical-aura.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call\\.|FAIL:|FAIL [^0]' qa-evidence/engraved-assets.log; then
            echo "FAIL: sculpted asset regression or GDScript error"
            exit 5
          fi
      - name: Render real frame evidence under virtual display
        run: |
          xvfb-run -a -s "-screen 0 720x1280x24" godot --path . --rendering-method gl_compatibility --script res://tests/visual_capture.gd > qa-evidence/native-godot.log 2>&1 || { tail -100 qa-evidence/native-godot.log; exit 1; }
          if grep -Eq 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call\\.' qa-evidence/native-godot.log; then
            echo "FAIL: GDScript errors detected despite generated screenshots"
            grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call' qa-evidence/native-godot.log
            exit 3
          fi
          for file in qa-evidence/native-01-launch.png qa-evidence/native-02-moving.png qa-evidence/native-03-after.png qa-evidence/native-06-d20-detail.png qa-evidence/native-07-staged-gold-pulse.png qa-evidence/native-08-staged-crimson-pulse.png qa-evidence/native-09-d8-detail.png qa-evidence/native-10-d12-detail.png; do
            test -s "$file"
            test "$(stat -c%s "$file")" -ge 10000
          done
          if cmp -s qa-evidence/native-01-launch.png qa-evidence/native-03-after.png; then
            echo "FAIL: image unchanged after actual physics throw"
            exit 2
          fi
          if cmp -s qa-evidence/native-06-d20-detail.png qa-evidence/native-07-staged-gold-pulse.png; then
            echo "FAIL: golden crit pulse did not render a visible native change"
            exit 4
          fi
          if cmp -s qa-evidence/native-07-staged-gold-pulse.png qa-evidence/native-08-staged-crimson-pulse.png; then
            echo "FAIL: critical colors or pulse rendering indistinguishable"
            exit 4
          fi
          if cmp -s qa-evidence/native-09-d8-detail.png qa-evidence/native-10-d12-detail.png; then
            echo "FAIL: D8 and D12 detail frames identical despite distinct dice"
            exit 6
          fi
          ls -lh qa-evidence/native-*.png
      - name: Run autonomous native-frame pixel critic
        run: python3 tools/visual/critique_native.py qa-evidence/native-06-d20-detail.png qa-evidence/native-07-staged-gold-pulse.png qa-evidence/native-08-staged-crimson-pulse.png
      - name: Publish native screenshot evidence regardless of failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-native-visual-evidence
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 14
