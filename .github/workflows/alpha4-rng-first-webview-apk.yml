name: Alpha RNG-first alternate WebGL Android APK
on:
  push:
    branches: [experiment/alpha4-rng-first-webgl]
    paths:
      - experiments/alpha4-rng-first/**
      - .github/workflows/alpha4-rng-first-webview-apk.yml
  workflow_dispatch:
concurrency:
  group: alpha4-plain-webgl-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-offline-webview-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RNG-first algorithm
        run: |
          node experiments/alpha4-rng-first/rng-core.test.cjs
          node --check experiments/alpha4-rng-first/glb-core.js
          node --check experiments/alpha4-rng-first/webgl-renderer.js
          node --check experiments/alpha4-rng-first/rng-core.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile actual native Android debug APK (public source only)
        run: |
          gradle --project-dir experiments/alpha4-rng-first/android-webview :app:assembleDebug --no-daemon --stacktrace
          test -s experiments/alpha4-rng-first/android-webview/app/build/outputs/apk/debug/app-debug.apk
          unzip -l experiments/alpha4-rng-first/android-webview/app/build/outputs/apk/debug/app-debug.apk | grep -E 'alpha4-webgl.html|webgl-renderer.js|rng-core.js|glb-core.js'
          if unzip -l experiments/alpha4-rng-first/android-webview/app/build/outputs/apk/debug/app-debug.apk | grep -q 'd20_selected_original_500k.glb'; then
            echo 'ERROR: private licensed GLB unexpectedly leaked to public APK'
            exit 44
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha4-RNG-first-Android-WebView-experiment-debug-APK
          path: experiments/alpha4-rng-first/android-webview/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
  real-android-emulator:
    needs: build-offline-webview-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Alpha4-RNG-first-Android-WebView-experiment-debug-APK
          path: build/alpha4-plain-apk
      - name: Enable virtualized Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p build/alpha4-plain-android-proof
            adb install -r build/alpha4-plain-apk/app-debug.apk
            adb shell am start -n io.adeldice.rngfirst/.MainActivity
            sleep 16
            adb logcat -d -s AlphaPlainWebGL:I chromium:E > build/alpha4-plain-android-proof/native-webview.log
            grep -F 'ALPHA_PLAIN_WEBGL_QA' build/alpha4-plain-android-proof/native-webview.log
            grep -F '"shaderCompiled":true' build/alpha4-plain-android-proof/native-webview.log
            adb exec-out screencap -p > build/alpha4-plain-android-proof/real_android_plain_webgl_screen.png
            test -s build/alpha4-plain-android-proof/real_android_plain_webgl_screen.png
            file build/alpha4-plain-android-proof/real_android_plain_webgl_screen.png | grep 'PNG image data'
            echo PASS_REAL_ANDROID_RENDERER_SHELL_ORIGINAL_PNG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha4-Plain-WebGL2-Real-Android-Emulator-PNG-Logs
          path: build/alpha4-plain-android-proof/
          retention-days: 30
          if-no-files-found: warn
