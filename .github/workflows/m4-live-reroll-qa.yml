name: M4 Real Selective Reroll QA
on:
  push:
    branches: [qa/m4-live-reroll]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-physical-reroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Import exact Godot/Jolt 4.6.3 production models
        run: godot --headless --path . --editor --quit
      - name: Validate physical selective-reroll source and genuine tests
        run: |
          godot --headless --path . --check-only --script res://src/core/physical_roll_pool.gd
          godot --headless --path . --check-only --script res://tests/m4_physical_reroll.gd
      - name: Throw genuinely selected Jolt source twice while keeping others on table
        run: godot --headless --path . --script res://tests/m4_physical_reroll.gd
      - name: Validate actual M4 source UI and physical click-through
        run: |
          godot --headless --path . --check-only --script res://src/main.gd
          godot --headless --path . --check-only --script res://src/ui/m4_advanced_roll_drawer.gd
          godot --headless --path . --check-only --script res://tests/m4_reroll_ui_integration.gd
      - name: User taps actual reroll selector, retain die positions and persist all Jolt faces
        run: godot --headless --path . --script res://tests/m4_reroll_ui_integration.gd
      - name: Do not regress original eight-concurrent-dice and percentiles
        run: godot --headless --path . --script res://tests/m4_physical_pool.gd
      - name: Install real video capture dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 libfontconfig1 libxcursor1 \
            libxrandr2 libxi6 libxinerama1 libxrender1 libxext6 libxfixes3 \
            libxkbcommon0 libwayland-cursor0 python3-pil
      - name: Check native M4 first-cast and reroll visual capture compiles
        run: godot --headless --path . --check-only --script res://tests/m4_ui_temporal_capture.gd
      - name: Capture actual UI-selected real reroll and all settled physical dice at 24fps
        run: bash tools/visual/run_m4_ui_capture.sh
      - name: Decode every rendered mobile screenshot including the actual second throw
        run: python3 tools/visual/audit_m4_ui_frames.py qa-evidence/m4-ui-24fps
      - name: Preserve full original reroll video, timeline and 24-frame sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-selective-real-jolt-reroll-24fps
          path: qa-evidence/m4-ui-24fps/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate source scripts for Android physical selected-reroll recording
        run: |
          python3 -m py_compile tools/visual/audit_android_avd_sequence.py
          bash -n tools/visual/run_android_avd_rolls.sh
      - name: Real-face formula/reroll-trace and offline storage regressions
        run: |
          godot --headless --path . --script res://tests/m4_roll_formula.gd
          godot --headless --path . --script res://tests/m4_roll_persistence.gd
