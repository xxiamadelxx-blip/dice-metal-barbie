name: M5 alternative Three.js WebGL2 Android APK (no Godot)
on:
  push:
    branches: [experiment/m5-android-renderer-alternatives]
    paths:
      - "experiments/android-renderers/**"
      - ".github/workflows/m5-alternative-three-webgl-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-webgl2-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bundled Three.js and build offline HTML/CSS/JS
        working-directory: experiments/android-renderers/web
        run: |
          npm install --no-audit --no-fund --package-lock-only
          npm ci --no-audit --no-fund
          npm run build
          if grep -E 'cdn.jsdelivr.net|unpkg.com' dist/index.html; then
            echo "Unexpected external module" && exit 3
          fi
      - name: Generate exact public synthetic 500k glTF (NOT user PBR)
        run: |
          python3 experiments/android-renderers/web/tools/make_synthetic_500k_glb.py experiments/android-renderers/web/build/synthetic_nonpremium_500k.glb
      - name: Render real 500k GLB on Chromium WebGL2 software GPU
        working-directory: experiments/android-renderers/web
        run: |
          set -eu
          command -v google-chrome || command -v chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > build/vite-preview.log 2>&1 &
          echo "$!" > build/server.pid
          sleep 4
          RENDER_LAB_EVIDENCE=build/browser-evidence npm run smoke
      - name: Upload real browser screenshot, GPU counters and offline web bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M5-ThreeJS-WebGL2-500k-actual-render-and-offline-bundle
          path: |
            experiments/android-renderers/web/build/browser-evidence/
            experiments/android-renderers/web/build/vite-preview.log
            experiments/android-renderers/web/dist/
          retention-days: 21
          if-no-files-found: warn
  build-real-debug-apk:
    needs: real-webgl2-render
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package actual Three.js r184 into offline Android assets
        working-directory: experiments/android-renderers/web
        run: |
          npm install --no-audit --no-fund --package-lock-only
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets
          cp -a dist/. ../android/app/src/main/assets/
          test -s ../android/app/src/main/assets/index.html
          test -n "$(find ../android/app/src/main/assets/assets -name '*.js' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path
          home=Path('../android/app/src/main/assets')
          assert (home/'index.html').is_file()
          js=list(home.glob('assets/*.js'))
          assert js
          assert sum(f.stat().st_size for f in js)>450000,("Three library not bundled",js)
          source=(home/'index.html').read_text()
          assert 'cdn.jsdelivr.net' not in source
          manifest=Path('../android/app/src/main/AndroidManifest.xml').read_text()
          assert not any('android.permission.INTERNET' in line for line in manifest.splitlines() if '<uses-permission' in line),("Offline APK requests network permission")
          print("PASS_OFFLINE_ANDROID_EMBEDDED_THREE_JS",len(js),"file size",sum(f.stat().st_size for f in js))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile real installable offline Android debug APK
        working-directory: experiments/android-renderers/android
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve actual built APK (no original licensed GLB included)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M5-ThreeJS-Android-WebView-real-offline-debug-APK
          path: experiments/android-renderers/android/app/build/outputs/apk/debug/
          retention-days: 21
          if-no-files-found: warn
