name: M4 independent local Qwen 7B editor touch critique
on:
  pull_request:
    paths:
      - 'tools/visual/run_android_pool_editor.sh'
      - 'tools/visual/audit_android_avd_sequence.py'
      - '.github/workflows/m4-pool-editor-independent-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m4-local-editor-critic
  cancel-in-progress: true
jobs:
  source-grounded-editor-critique:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original source syntax and engineering contract
        run: |
          set -euo pipefail
          python3 scripts/engineering_router.py validate
          bash -n tools/visual/run_android_pool_editor.sh
          python3 -m py_compile tools/visual/audit_android_avd_sequence.py
      - name: Install actual independent local Qwen 7B, no model API key
        run: bash scripts/gauntlet_setup_local.sh
      - name: Demand adversarial quote from current source rather than incident summaries
        run: |
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          out=Path('outputs/editor-independent-critic')
          out.mkdir(parents=True,exist_ok=True)
          whole=Path('tools/visual/run_android_pool_editor.sh').read_text()
          focus=whole.split('# SECOND REAL-ANDROID INTERACTION ROUND:',1)[1].split('# Existing final test',1)[0]
          audit=Path('tools/visual/audit_android_avd_sequence.py').read_text()
          checks=audit.split('full_ux_trace=[',1)[1].split('cursor=0',1)[0]
          code='REAL ADB BUTTON SOURCE:\n'+focus+'\nFRAME AND EVENT AUDIT SOURCE:\n'+checks
          prompt=('You are an INDEPENDENT ADVERSARIAL QA REVIEWER. Inspect the exact source below. '
            'Report ONE concrete false-positive, touch-coordinate, event-order, cancellation, or Jolt-survival risk. '
            'Do NOT summarize old bugs, do not claim phone or runtime passed, and NEVER invent a test run. '
            'Reply with EXACTLY THREE lines, no JSON, Markdown, code fences or additional text. '
            'QUOTE: an exact contiguous 16+ character substring of SOURCE. '
            'RISK: one specific testable edge case for that line (max 30 words). '
            'TEST: one feasible deterministic check of the edge case (max 30 words).\n\nSOURCE:\n'+code)
          (out/'original-prompt.txt').write_text(prompt)
          req=urllib.request.Request('http://127.0.0.1:11434/api/generate',
            data=json.dumps({'model':'qwen2.5-coder:7b','prompt':prompt,'stream':False,
             'options':{'temperature':0,'num_predict':400}}).encode(),
            headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=420) as res:
            raw=json.load(res)
          (out/'original-unmodified-response.json').write_text(json.dumps(raw,indent=2,ensure_ascii=False))
          reply=raw.get('response','')
          (out/'independent-critic-original.txt').write_text(reply)
          verdict='NOT_VERIFIED'
          try:
            lines=[x.strip() for x in reply.splitlines() if x.strip()]
            assert len(lines)==3, 'Not exactly three evidence lines'
            assert lines[0].startswith('QUOTE: ') and lines[1].startswith('RISK: ') and lines[2].startswith('TEST: ')
            quote=lines[0][7:].strip().strip('`').strip()
            assert len(quote)>=16 and quote in code, 'Literal source quote not present'
            assert len(lines[1])>=25 and len(lines[2])>=25, 'No concrete risk/test'
            assert len(lines[1].split())<=34 and len(lines[2].split())<=34, 'Unbounded summary instead of focused finding'
            verdict='SOURCE_GROUNDED_REVIEW_RECEIVED'
          except Exception as err:
            (out/'contract-failure.txt').write_text(repr(err))
          (out/'provenance.json').write_text(json.dumps({
            'reviewer':'local Ollama qwen2.5-coder:7b','source_review':verdict,
            'actual_android_runtime':'NOT_VERIFIED_BY_REVIEWER',
            'source_risk_triage':'REQUIRES_SEPARATE_EVIDENCE'},indent=2))
          print(verdict)
          if verdict!='SOURCE_GROUNDED_REVIEW_RECEIVED':
            raise SystemExit(12)
          PY
      - name: Preserve raw critic output and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-local-editor-actual-qwen7b-critique
          path: outputs/editor-independent-critic/
          if-no-files-found: warn
          retention-days: 14
