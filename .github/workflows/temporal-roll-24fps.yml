name: Dice temporal Gauntlet — sequential 24 FPS real physical throws
on:
  workflow_call:
    inputs:
      fresh_assets:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  every-frame:
    name: Record five actual Jolt throws at 24fps; analyze every frame
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Consume same-run fresh GLBs (not stale repository binaries)
        if: inputs.fresh_assets
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-fresh-glbs
          path: build/gauntlet-glb
      - name: Check GLB SHA256 and install before Godot import
        if: inputs.fresh_assets
        run: |
          set -euo pipefail
          (cd build/gauntlet-glb && sha256sum -c glb-sha256.txt)
          mkdir -p src/assets/generated
          for die in d4 d6 d8 d12 d20; do
            test -s "build/gauntlet-glb/${die}_boolean_engraved.glb"
            cp "build/gauntlet-glb/${die}_boolean_engraved.glb" "src/assets/generated/${die}_boolean_engraved.glb"
          done
      - name: Install FFmpeg/Xvfb/Mesa and Pillow
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 libfontconfig1 libxcursor1 \
            libxrandr2 libxi6 libxinerama1 libxrender1 libxext6 libxfixes3 \
            libxkbcommon0 libwayland-cursor0 python3-pil
      - name: Import pinned 3D sculpted meshes
        run: godot --headless --path . --editor --quit
      - name: Record complete five-throw 24fps physical timeline
        run: bash tools/visual/run_temporal_capture.sh
      - name: Sequentially decode and inspect EVERY video frame
        run: python3 tools/visual/audit_roll_sequence.py qa-evidence/temporal
      - name: Publish full videos, per-frame metrics, result logs and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-godot-24fps-every-throw
          path: qa-evidence/temporal/
          if-no-files-found: warn
          retention-days: 14
