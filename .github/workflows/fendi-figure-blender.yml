name: Fendi reference | real Blender 3D experiment
on:
  push:
    branches:
      - experiment/fendi-ss23-figure-qa
    paths:
      - .github/workflows/fendi-figure-blender.yml
      - experiments/fendi-ss23/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fendi-blender-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install real Blender and image processing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender imagemagick python3-pil
          blender -b --version | head -5
      - name: Download verified high-resolution reference
        run: |
          mkdir -p build/fendi-ss23
          curl -fLSs --retry 3 --max-time 40 -o build/fendi-ss23/reference.jpg https://fashionsnap-assets.com/article/images/2022/09/fendi_w23ss_look_053.jpeg
          identify build/fendi-ss23/reference.jpg
      - name: Prepare image-to-3D Python environment
        run: |
          python3 -m venv /tmp/fendi-3d
          /tmp/fendi-3d/bin/pip install -q --upgrade pip
          /tmp/fendi-3d/bin/pip install -q 'gradio_client==1.13.0' 'rembg[cpu]' Pillow onnxruntime
      - name: Generate a real mesh from isolated subject, preserve failures
        run: |
          /tmp/fendi-3d/bin/python experiments/fendi-ss23/generate.py
          cat build/fendi-ss23/generation.json
      - name: Render four mesh-only Blender views, save blend
        run: |
          if [ -s build/fendi-ss23/candidate.glb ]; then
            blender -b -t 4 --python experiments/fendi-ss23/render.py
          else
            echo "NOT VERIFIED: no generated mesh; cannot honestly render or compare a figurine"
          fi
      - name: Upload reference, segmentation, logs, model and Blender previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fendi-ss23-figure-experiment
          path: build/fendi-ss23/
          if-no-files-found: error
          retention-days: 7
