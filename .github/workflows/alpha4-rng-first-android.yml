name: Alpha4 RNG-first actual offline Android WebView APK and emulator
on:
  push:
    branches: [experiment/alpha4-rng-first-webgl]
    paths:
      - "experiments/alpha4-rng-first/android/**"
      - "experiments/alpha4-rng-first/manifest.webmanifest"
      - ".github/workflows/alpha4-rng-first-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-real-offline-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    defaults:
      run:
        working-directory: experiments/alpha4-rng-first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # v3 used the removed 'tools' SDK package and fails on current runners.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Copy actual previously browser-tested self-contained renderer into APK
        run: |
          set -eu
          test -s bundle.js
          test -s index.html
          mkdir -p android/app/src/main/assets/exp
          cp index.html manifest.webmanifest bundle.js android/app/src/main/assets/exp/
          sha256sum bundle.js > android/app/src/main/assets/exp/WEBPACK_SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert "android.permission.INTERNET" not in p
          assert "usesCleartextTraffic=\"false\"" in p
          assert "android:hardwareAccelerated=\"true\"" in p
          js=Path("android/app/src/main/assets/exp/bundle.js").read_text()
          assert len(js)>100000
          print("PASS_PACKAGE_PROVEN_WEBGL_BUNDLE_OFFLINE_NO_INTERNET",len(js))
          PY
      - name: Build REAL installable offline Android APK
        run: |
          gradle -p android --no-daemon :app:assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect APK manifest permissions and packaged Three engine
        run: |
          set -eu
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'assets/exp/bundle.js'
          unzip -l "$apk" | grep 'assets/exp/index.html'
          if unzip -p "$apk" AndroidManifest.xml | strings | grep -q "android.permission.INTERNET"; then
            echo "FAIL apk asks for network";exit 4
          fi
          sha256sum "$apk" > android/app/build/outputs/apk/debug/sha256.txt
          echo "PASS_ANDROID_OFFLINE_INSTALLABLE_APK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha4-Real-Offline-Three-WebGL-Android-debug-APK
          path: |
            experiments/alpha4-rng-first/android/app/build/outputs/apk/debug/app-debug.apk
            experiments/alpha4-rng-first/android/app/build/outputs/apk/debug/sha256.txt
          retention-days: 30
          if-no-files-found: warn
  real-android-emulator:
    needs: build-real-offline-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Alpha4-Real-Offline-Three-WebGL-Android-debug-APK
          path: build/alpha4-apk
      - name: Allow x86 Android KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p build/alpha4-android-proof
            adb install -r build/alpha4-apk/app-debug.apk
            adb shell am start -n org.dicemetalbarbie.alpha4webgl/.MainActivity
            sleep 16
            adb logcat -d -s AlphaWebGL:I chromium:E > build/alpha4-android-proof/native-webview.log
            grep -F 'ALPHA4_WEBGL_QA' build/alpha4-android-proof/native-webview.log
            grep -q 'ready' build/alpha4-android-proof/native-webview.log
            adb exec-out screencap -p > build/alpha4-android-proof/real_android_webview_screen.png
            test -s build/alpha4-android-proof/real_android_webview_screen.png
            echo PASS_REAL_ANDROID_APK_INSTALLED_BOOTED_WEBVIEW_SCREENSHOT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha4-Real-Android-Emulator-WebGL-Evidence
          path: build/alpha4-android-proof/
          retention-days: 30
          if-no-files-found: warn
