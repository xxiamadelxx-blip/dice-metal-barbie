name: M4 real Android player composer preflight (stage)
on:
  push:
    branches: [agent/m4-avd-pool-true-edit-20261011]
permissions:
  contents: read
jobs:
  android-shell-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile genuine AVD Bash and Python audit
        run: |
          set -euo pipefail
          bash -n tools/visual/run_android_avd_rolls.sh
          bash -n tools/visual/run_android_percentile_sources.sh
          bash -n tools/visual/run_android_pool_editor.sh
          python3 -m py_compile tools/visual/audit_android_avd_sequence.py
          grep -Fq 'bash tools/visual/run_android_pool_editor.sh' tools/visual/run_android_avd_rolls.sh
          grep -Fq 'DICE_M4_POOL_APPLIED formula=3d6+1d20-2' tools/visual/run_android_pool_editor.sh
          grep -Fq 'DICE_M4_SIMULTANEOUS_COMPLETED=4' tools/visual/run_android_pool_editor.sh
          echo 'Static/shell PASS only. Real Android interaction must run in full AVD.'
  actual-godot-jolt:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import all actual Godot project source
        run: godot --headless --path . --editor --quit
      - name: Real four Jolt bodies, visible Apply and source parser limits
        run: |
          set -e
          godot --headless --path . --script res://tests/m4_pool_composer_jolt.gd > m4-real.log 2>&1 || { tail -140 m4-real.log; exit 1; }
          grep -E 'M4_ACTUAL_POOL_COMPOSER_JOLT checks=([4-9][0-9]|[1-9][0-9]+) failures=0' m4-real.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-m4-physical-pool-stage-log
          path: m4-real.log
          if-no-files-found: warn
