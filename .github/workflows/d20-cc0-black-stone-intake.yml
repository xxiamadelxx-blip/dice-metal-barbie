name: M5 import REAL CC0 polished black stone PBR maps (licensed alternatives)
on:
  push:
    branches: [experiment/m5-learn-codex-d20]
    paths:
      - "tools/materials/fetch_polyhaven_cc0_black_stone.py"
      - ".github/workflows/d20-cc0-black-stone-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-license-and-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image decoder
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 -m py_compile tools/materials/fetch_polyhaven_cc0_black_stone.py
      - name: Download three real CC0 maps via official Poly Haven API and verify bytes
        run: |
          set -eu
          timeout 190 python3 tools/materials/fetch_polyhaven_cc0_black_stone.py build/cc0-black-stone | tee build-cc0-public-api.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("build/cc0-black-stone")
          j=json.loads((root/"cc0_material_source_manifest.json").read_text())
          assert len(j["maps"])==3
          assert all(m["source_download_verified"] for m in j["maps"])
          assert j["material_subject"].startswith("BLACK MARBLE")
          print("PASS_CC0_ORIGINAL_FILE_SOURCE_NOT_GENERATED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M5-real-CC0-black-stone-original-three-PBR-maps
          path: |
            build/cc0-black-stone/
            build-cc0-public-api.log
          retention-days: 30
          if-no-files-found: warn
