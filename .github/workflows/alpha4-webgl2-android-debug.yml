name: Alpha4 parallel WebGL2 Android debug (NO private GLB)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/alpha4-rng-first-webgl
    paths:
      - 'experiments/alpha4-rng-first/**'
      - '.github/workflows/alpha4-webgl2-android-debug.yml'

concurrency:
  group: alpha4-webgl2-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-webview:
    name: Build offline Android WebView debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tooling
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android 35 platforms
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Generate unlicensed reproducible D20 fixture for real Android GPU proof
        run: |
          python3 experiments/alpha4-rng-first/tools/make_public_qa_glb.py experiments/alpha4-rng-first/android-app/app/src/main/assets/qa_fixture.glb
          test -s experiments/alpha4-rng-first/android-app/app/src/main/assets/qa_fixture.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('experiments/alpha4-rng-first/android-app/app/src/main/assets/qa_fixture.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF' and len(data)<16000
          n=struct.unpack_from('<I',data,12)[0]
          src=json.loads(data[20:20+n])
          assert sum(n['name'].startswith('Gold_') for n in src['nodes'])==20
          print('PASS_OPEN_20_FACE_GLB_IN_DEBUG_APK',len(data))
          PY
      - name: Compile Android WebGL2 application
        working-directory: experiments/alpha4-rng-first/android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK contains offline renderer, no licensed GLB and no INTERNET permission
        working-directory: experiments/alpha4-rng-first/android-app
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep 'assets/viewer.html'
          unzip -l "$apk" | grep 'assets/viewer.js'
          unzip -l "$apk" | grep 'assets/qa_fixture.glb'
          test "$(unzip -p "$apk" assets/qa_fixture.glb | wc -c)" -lt 16000
          blocked="$(unzip -Z1 "$apk" | grep -E '[.]glb$|[.]blend$' | grep -v -x 'assets/qa_fixture.glb' || true)"
          if [ -n "$blocked" ]; then
            echo "FAIL: prohibited private 3D model in APK: $blocked"
            exit 1
          fi
      - name: Upload unsigned experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: adel-dice-alpha4-webgl2-debug-apk
          path: experiments/alpha4-rng-first/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  real-android-emulator:
    needs: build-android-webview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: adel-dice-alpha4-webgl2-debug-apk
          path: build/alpha4-webgl2-apk
      - name: Enable Android KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot real Android 15 API35 emulator and verify WebGL2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p build/alpha4-webgl2-real-android-proof
            adb install -r build/alpha4-webgl2-apk/app-debug.apk
            adb shell am start -n app.adeldice.weblab/.MainActivity --ez qa_fixture true
            sleep 18
            adb logcat -d -s AlphaWebGLLab:I chromium:E > build/alpha4-webgl2-real-android-proof/native-webgl.log
            grep -F 'ALPHA_WEBGL_LAB_QA true' build/alpha4-webgl2-real-android-proof/native-webgl.log
            grep -F 'ALPHA_ANDROID_MODEL_QA {' build/alpha4-webgl2-real-android-proof/native-webgl.log
            python3 experiments/alpha4-rng-first/tools/check_android_gpu_qa.py build/alpha4-webgl2-real-android-proof/native-webgl.log
            adb exec-out screencap -p > build/alpha4-webgl2-real-android-proof/real_android_webgl2_app_screen.png
            test -s build/alpha4-webgl2-real-android-proof/real_android_webgl2_app_screen.png
            file build/alpha4-webgl2-real-android-proof/real_android_webgl2_app_screen.png | grep 'PNG image data'
            echo PASS_ACTUAL_ANDROID_WEBGL2_VIEWER_SHELL
      - name: Store actual Android screenshot and log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adel-dice-alpha4-webgl2-real-android-emulator-evidence
          path: build/alpha4-webgl2-real-android-proof/
          retention-days: 15
          if-no-files-found: warn