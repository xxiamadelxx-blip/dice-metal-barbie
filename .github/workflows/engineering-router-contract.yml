name: Canonical engineering router contract

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'config/engineering_routes.json'
      - 'scripts/engineering_router.py'
      - 'tests/test_engineering_router.py'
      - 'docs/ENGINEERING_ROUTER.md'
      - 'docs/handoff/ACTIVE_ROUTING_HANDOFF.json'
      - '.github/workflows/engineering-router-contract.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'config/engineering_routes.json'
      - 'scripts/engineering_router.py'
      - 'tests/test_engineering_router.py'
      - 'docs/ENGINEERING_ROUTER.md'
      - 'docs/handoff/ACTIVE_ROUTING_HANDOFF.json'
      - '.github/workflows/engineering-router-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile router and tests
        run: python3 -m py_compile scripts/engineering_router.py tests/test_engineering_router.py
      - name: Exercise routing, resume, blocked recovery, atomic handoff
        run: python3 -m unittest discover -s tests -p 'test_engineering_router.py' -v
      - name: Validate registry and handoff
        run: python3 scripts/engineering_router.py validate
      - name: Exercise commands without external services
        run: |
          python3 scripts/engineering_router.py audit > "$RUNNER_TEMP/router-audit.json"
          python3 scripts/engineering_router.py enter --intent "продолжай" > "$RUNNER_TEMP/router-continue.json"
          python3 scripts/engineering_router.py enter --intent "завис" > "$RUNNER_TEMP/router-stuck.json"
          python3 scripts/engineering_router.py handoff > "$RUNNER_TEMP/router-handoff.json"
      - name: Preserve original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-router-diagnostics
          path: ${{ runner.temp }}/router-*.json
          if-no-files-found: ignore
          retention-days: 14
